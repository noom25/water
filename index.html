<!doctype html>

<style>
:root{
  --bg:#eef4f9; --card:#fff; --ink:#1d2a36; --muted:#64748b; --line:#dbe3ea;
  --pri:#0b6fb8; --pri2:#0a5a95; --pri-soft:#e3f0fa; --ok:#15803d; --ok-soft:#dcfce7;
  --warn:#b45309; --warn-soft:#fef3c7; --bad:#b91c1c; --bad-soft:#fee2e2; --orange:#f97316;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',Tahoma,sans-serif;font-size:15px}
header{background:linear-gradient(120deg,#0a5a95,#0ea5e9);color:#fff;padding:12px 18px;display:flex;gap:14px;align-items:flex-start}
header .logo{width:68px;height:68px;flex:none;object-fit:contain;background:#fff;border-radius:50%;padding:2px;display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer}
header .t1{font-size:20px;font-weight:700}
header .t2{font-size:14px;opacity:.95}
header .credit{font-size:13px;opacity:.95;margin:2px 0}
header .credit a{color:#fff;background:var(--orange);padding:1px 10px;border-radius:20px;text-decoration:none;font-weight:600;display:inline-block;margin-left:6px;cursor:pointer}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 10px;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.active{color:var(--pri);border-bottom-color:var(--pri)}
nav button.sup{color:var(--orange)}
nav button.sup.active{border-bottom-color:var(--orange)}
main{max-width:1250px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:14px}
h2{margin:0 0 12px;font-size:19px;color:var(--pri2)}
h3{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px;min-width:140px}
.fld label{font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #c5d1dc;border-radius:7px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid #93c5fd;border-color:var(--pri)}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--pri);color:#fff}
.btn:hover{background:var(--pri2)}
.btn.sec{background:#e2e8f0;color:var(--ink)} .btn.sec:hover{background:#cbd5e1}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)} .btn.or{background:var(--orange)}
.btn.sm{padding:4px 9px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:#fff;border-radius:12px;padding:14px;border-left:5px solid var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat .k{font-size:13px;color:var(--muted)} .stat .v{font-size:24px;font-weight:700;margin-top:4px}
.stat.g{border-color:var(--ok)} .stat.r{border-color:var(--bad)} .stat.y{border-color:#f59e0b}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
th{background:#f1f6fa;font-size:13.5px;white-space:nowrap}
td.n,th.n{text-align:right}
td.c,th.c{text-align:center}
tfoot td{font-weight:700;background:#f8fafc}
.tag{display:inline-block;padding:1px 8px;border-radius:12px;font-size:12.5px;font-weight:600}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.mut{background:#e2e8f0;color:#475569}
.in-curr,.in-prev{width:95px;text-align:right}
tr.err td{background:#fff1f2}
tr.warnrow td{background:#fffbeb}
.alert{background:#fef3c7;border-left:5px solid #f59e0b;border-radius:8px;padding:10px 14px;margin-bottom:12px}
.inst{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;background:#0B4A8F;color:#fff;border-radius:12px;
  padding:12px 14px;box-shadow:0 8px 26px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center;font-size:14px}
.inst b{display:block;margin-bottom:2px}
.inst button{flex:none;border:0;border-radius:8px;padding:7px 13px;font:inherit;font-weight:600;cursor:pointer}
.inst .go{background:#fff;color:#0B4A8F}
.inst .no{background:transparent;color:#cbd5e1}
@media print{.inst{display:none}}
.alert.bad{background:#fee2e2;border-left-color:#b91c1c}
.alert b{display:block;margin-bottom:2px}
.auditbox{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;font-size:13px}
.auditbox div{padding:5px 10px;border-bottom:1px solid #f1f5f9}
.muted{color:var(--muted);font-size:13px}
.chart{display:flex;align-items:flex-end;gap:8px;height:200px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart .bars{display:flex;gap:2px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.chart .bar{width:28%;max-width:18px;border-radius:4px 4px 0 0}
.chart .lbl{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:13px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.searchres{border:1px solid var(--line);border-radius:8px;margin-top:6px;max-height:260px;overflow:auto}
.searchres div{padding:8px 10px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.searchres div:hover{background:var(--pri-soft)}
.info{background:var(--pri-soft);border-radius:8px;padding:10px 12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:24px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
footer{text-align:center;color:var(--muted);font-size:13px;padding:16px}
footer a{color:var(--orange);font-weight:600;cursor:pointer}
/* คู่มือการใช้งาน */
.hp-hero{background:linear-gradient(135deg,#0B4A8F,#1d6fc0);color:#fff;border-radius:14px;padding:20px 24px;margin-bottom:16px}
.hp-hero h2{margin:0 0 6px;font-size:1.35rem;color:#fff}.hp-hero p{margin:0;line-height:1.7}
.hp-toc{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.hp-toc a{background:var(--pri-soft);color:var(--pri);padding:6px 12px;border-radius:20px;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}
.hp-toc a:hover{background:var(--pri);color:#fff}
details.hp{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff;overflow:hidden}
details.hp>summary{cursor:pointer;padding:13px 16px;font-weight:700;font-size:15.5px;list-style:none;display:flex;align-items:center;gap:9px}
details.hp>summary::-webkit-details-marker{display:none}
details.hp>summary::after{content:'▾';margin-left:auto;color:var(--muted);font-size:15px}
details.hp[open]>summary{background:var(--pri-soft);border-bottom:1px solid var(--line)}
details.hp[open]>summary::after{content:'▴'}
.hp-body{padding:14px 18px 18px;line-height:1.85}
.hp-body h4{margin:16px 0 6px;font-size:14.5px;color:var(--pri)}
.hp-body h4:first-child{margin-top:0}
.hp-body ol,.hp-body ul{margin:6px 0 10px;padding-left:22px}
.hp-body li{margin-bottom:5px}
.hp-body table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
.hp-body th,.hp-body td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.hp-body th{background:var(--pri-soft)}
.hp-k{background:#eef2f7;border:1px solid #cbd5e1;border-bottom-width:2px;border-radius:5px;padding:1px 7px;font-size:13px;font-weight:600}
.hp-warn{background:#fef3c7;border-left:5px solid #f59e0b;border-radius:8px;padding:10px 14px;margin:10px 0}
.hp-bad{background:#fee2e2;border-left:5px solid #b91c1c;border-radius:8px;padding:10px 14px;margin:10px 0}
.hp-ok{background:#dcfce7;border-left:5px solid #16a34a;border-radius:8px;padding:10px 14px;margin:10px 0}
nav button.hp-nav{color:var(--pri)}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
/* print */
#printArea{display:none}
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  body{background:#fff;font-size:13.5px}
  @page{size:A4;margin:10mm}
}
.p-head{text-align:center;margin-bottom:8px}
.p-head img{width:56px;height:56px;object-fit:contain}
.p-head .o{font-weight:700;font-size:17px}
.p-tbl th,.p-tbl td{border:1px solid #333;padding:4px 6px;font-size:13px}
.p-tbl th{background:#eee}
.sign{display:flex;justify-content:space-around;margin-top:30px;text-align:center}
.slip{height:136mm;padding:4mm 6mm;border-bottom:1px dashed #999;page-break-inside:avoid;position:relative;overflow:hidden}
.slip.nb{border-bottom:0}
.slip .tt{font-size:17px;font-weight:700;text-align:center}
.slip table td,.slip table th{border:1px solid #444;padding:3px 6px;font-size:13px}
.slip .big{font-size:16px;font-weight:700}
.copy{position:absolute;top:4mm;right:6mm;border:1px solid #333;padding:1px 8px;font-size:12px}
.pb{page-break-after:always}
/* --- ใบเสร็จ + ใบแจ้งหนี้ เต็มแผ่น (ตัดกลาง) --- */
.pg{page-break-after:always}
.pg:last-child{page-break-after:auto}
.sheet{display:flex;height:138mm;box-sizing:border-box;overflow:hidden;border-bottom:1px dashed #777}
.pg .sheet:last-child{border-bottom:0}
.half{width:50%;padding:2.5mm 5mm;font-size:12.5px;line-height:1.5}
.half.l{border-right:1px dashed #777}
.half .ti{text-align:center;font-weight:700;font-size:14.5px;margin-top:2px}
.half .sub{text-align:center;font-size:12px;margin-bottom:3px}
.half .dt{display:inline-block;border-bottom:1px dotted #333;text-align:center;padding:0 4px}
.half table{width:100%;border-collapse:collapse;margin:2px 0}
.half table th,.half table td{border:1px solid #333;padding:1px 4px;font-size:12px;vertical-align:top}
.half table.nb td{border:0;padding:0}
.half .note{text-align:center;font-size:12px;margin-top:8px}
.half .sg{margin-top:12px;text-align:center;font-size:12px}
/* --- ใบแจ้งหนี้ A6 : 4 ราย/แผ่น ตัด 4 ชิ้น --- */
.a6wrap{display:flex;flex-wrap:wrap;page-break-after:always}
.a6wrap:last-child{page-break-after:auto}
.a6{width:50%;height:92mm;box-sizing:border-box;padding:3.5mm 5mm;overflow:hidden;
  font-size:11.5px;line-height:1.55;border-right:1px dashed #999;border-bottom:1px dashed #999}
.a6:nth-child(2n){border-right:0}
.a6:nth-child(n+5){border-bottom:0}
.a6 .hd{text-align:center;font-weight:700;font-size:12.5px;border-bottom:1px solid #333;padding-bottom:2px;margin-bottom:3px}
.a6 .ti{text-align:center;font-weight:700;font-size:13.5px;margin-bottom:3px}
.a6 table{width:100%;border-collapse:collapse;margin:3px 0}
.a6 table th,.a6 table td{border:1px solid #444;padding:1px 3px;font-size:11px}
.a6 table.nb td{border:0;padding:0}
.a6 .tot{border:1.5px solid #000;padding:3px 5px;margin-top:3px;display:flex;justify-content:space-between;align-items:center}
.a6 .tot b{font-size:15px}
.a6 .wn{font-size:10.5px;margin-top:4px;text-align:center}
</style>
</head>
<body>

<header>
  <img id="hLogo" class="logo" alt="ตราสัญลักษณ์" style="display:none"><img id="hLogoPh" class="logo" alt="โลโก้ระบบ" src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cpath%20d%3D%22M50%206C50%206%2080%2040%2080%2060A30%2030%200%201%201%2020%2060C20%2040%2050%206%2050%206Z%22%20fill%3D%22%230B4A8F%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M42%2047h11a8.5%208.5%200%200%201%200%2017H42V47z%22%2F%3E%3Cpath%20d%3D%22M42%2064h12.5a8.5%208.5%200%200%201%200%2017H42V64z%22%2F%3E%3Cpath%20d%3D%22M48%2041v46%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">

<script>
/* ===== รูป QR สำหรับเมนูสนับสนุน ===== */

/* ===== ข้อมูล ===== */
const KEY = 'villageWater_v1';
const DEF_SETTINGS = {
  orgName:'', orgAddr:'', systemName:'กิจการประปา', logo:'',
  moos:'1,2,3,4,5',
  rateMode:'tier', flatRate:8, tierMethod:'progressive',
  tiers:[{upTo:10,rate:6},{upTo:20,rate:8},{upTo:null,rate:10}],
  meterFee:10, minCharge:30,
  fineMode:'flat', fineValue:10, dueDay:15,
  collectorName:'', collectorPos:'เจ้าหน้าที่จัดเก็บรายได้',
  headName:'', headPos:'ผู้อำนวยการกองคลัง',
  expCats:['ค่าไฟฟ้าระบบสูบน้ำ','สารเคมี (คลอรีน/สารส้ม)','ค่าซ่อมแซมระบบประปา','วัสดุอุปกรณ์ประปา','ค่าตอบแทนผู้ดูแลระบบ/ผู้จดมาตร','ค่าวัสดุสำนักงาน/พิมพ์เอกสาร','อื่น ๆ'],
  openBal:0, openDate:'', expSeq:{},
  receiptSeq:{}, lastBackup:'',
  /* --- แบบพิมพ์ใบแจ้งค่าน้ำ --- */
  tambon:'', amphoe:'', province:'',
  villages:'',                 // ชื่อหมู่บ้านแต่ละหมู่ บรรทัดละ 1 เช่น  14=ปรือคันใต้
  billForm:'kpp',              // kpp = ใบเสร็จ+ใบแจ้งหนี้ (เต็มแผ่น) · slip = แบบย่อ 2 ใบ/แผ่น
  invPrefix:'INV', invSeq:{},
  vatEnabled:false, vatRate:7, taxInvoiceLabel:false,
  chargeFeeOnZero:true,        // ไม่ใช้น้ำเลย ยังเก็บค่าบริการทั่วไปหรือไม่
  noticeDays:7,
  chiefName:'', chiefPos:'หัวหน้าหน่วยงานคลัง'
};
let DB={users:[],readings:[],payments:[],expenses:[],settings:Object.assign({},DEF_SETTINGS),audit:[]};
let STORE='local';            // ที่เก็บข้อมูลที่ใช้จริง: 'idb' = IndexedDB (เก็บได้มาก) · 'local' = localStorage (จำกัด ~5MB)
let LAST_SIZE=0;
function normalize(d){
  if(!d||typeof d!=='object')d={};
  d.settings=Object.assign({},DEF_SETTINGS,d.settings||{});
  d.users=Array.isArray(d.users)?d.users:[];
  d.readings=Array.isArray(d.readings)?d.readings:[];
  d.payments=Array.isArray(d.payments)?d.payments:[];
  d.expenses=Array.isArray(d.expenses)?d.expenses:[];
  d.audit=Array.isArray(d.audit)?d.audit:[];
  // กันตราสัญลักษณ์ที่ไม่ใช่รูปภาพ (ไฟล์สำรองที่ถูกแก้ไข อาจฝังสคริปต์)
  if(d.settings.logo&&!/^data:image\//.test(String(d.settings.logo)))d.settings.logo='';
  return d;
}
function serialize(){const s=JSON.stringify(DB);LAST_SIZE=s.length;return s;}
function loadLocal(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}

/* ===== ดัชนีในหน่วยความจำ : ค้นหาเร็วขึ้นมากเมื่อข้อมูลเยอะ ===== */
const IDX={user:new Map(),pay:new Map(),rdUser:new Map(),rdPeriod:new Map(),unpaid:new Map()};
function pushMap(m,k,v){let a=m.get(k);if(!a){a=[];m.set(k,a);}a.push(v);}
function reindex(){
  IDX.user.clear();IDX.pay.clear();IDX.rdUser.clear();IDX.rdPeriod.clear();IDX.unpaid.clear();
  for(const u of DB.users)IDX.user.set(u.id,u);
  for(const p of DB.payments)IDX.pay.set(p.id,p);
  for(const r of DB.readings){
    pushMap(IDX.rdUser,r.userId,r);
    pushMap(IDX.rdPeriod,r.period,r);
    if(!r.paid)pushMap(IDX.unpaid,r.userId,r);
  }
  const byP=(a,b)=>a.period.localeCompare(b.period);
  for(const a of IDX.rdUser.values())a.sort(byP);
  for(const a of IDX.unpaid.values())a.sort(byP);
}

/* ===== ฐานข้อมูลในเครื่อง (IndexedDB) : เก็บได้มากกว่า localStorage หลายสิบเท่า ===== */
const IDB_NAME='villageWater', IDB_VER=1, SNAP_KEEP=14;
let _idb=null;
function openDB(){
  if(_idb)return _idb;
  _idb=new Promise(res=>{
    try{
      if(typeof indexedDB==='undefined')return res(null);
      const rq=indexedDB.open(IDB_NAME,IDB_VER);
      rq.onupgradeneeded=()=>{const db=rq.result;
        if(!db.objectStoreNames.contains('main'))db.createObjectStore('main',{keyPath:'id'});
        if(!db.objectStoreNames.contains('snap'))db.createObjectStore('snap',{keyPath:'id'});};
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>res(null);
      rq.onblocked=()=>res(null);
      setTimeout(()=>res(null),4000);            // เบราว์เซอร์บางตัวปิด IndexedDB เมื่อเปิดไฟล์แบบ file://
    }catch(e){res(null);}
  });
  return _idb;
}
function idbTx(store,mode,fn){
  return openDB().then(db=>{
    if(!db||!db.objectStoreNames.contains(store))return null;
    return new Promise(res=>{
      try{
        const tx=db.transaction(store,mode),st=tx.objectStore(store);
        let out=null;
        fn(st,v=>{out=v;});
        tx.oncomplete=()=>res(out);
        tx.onerror=()=>res(null);tx.onabort=()=>res(null);
      }catch(e){res(null);}
    });
  }).catch(()=>null);
}
function idbLoadMain(){
  return idbTx('main','readonly',(st,set)=>{const q=st.get('db');q.onsuccess=()=>set(q.result||null);});
}
function idbSaveMain(text){
  return idbTx('main','readwrite',(st,set)=>{st.put({id:'db',at:new Date().toISOString(),data:text});set(true);});
}

/* ===== บันทึกข้อมูล ===== */
let SAVE_FAILED=false;
function save(){
  DB.savedAt=new Date().toISOString();
  const text=serialize();
  let localOK=false;
  // localStorage เป็นสำเนาสำรองเท่านั้นเมื่อใช้ฐานข้อมูลในเครื่อง (ข้อมูลใหญ่มากจะข้ามไป)
  if(STORE!=='idb'||text.length<2000000){try{localStorage.setItem(KEY,text);localOK=true;}catch(e){localOK=false;}}
  if(STORE==='idb'){
    idbSaveMain(text).then(okv=>{
      if(okv){SAVE_FAILED=false;}
      else if(!localOK){saveFailed('เขียนลงฐานข้อมูลในเครื่องไม่สำเร็จ');}
    });
    SAVE_FAILED=false;
  }else{
    if(localOK)SAVE_FAILED=false;
    else saveFailed('พื้นที่เก็บข้อมูลของเบราว์เซอร์เต็ม (localStorage จำกัดประมาณ 5 MB)');
  }
  reindex();
  snapshotLater();
}
function saveFailed(why){
  SAVE_FAILED=true;
  alert('⛔ บันทึกข้อมูลลงเครื่องไม่สำเร็จ\nสาเหตุ: '+why+
    '\n\n⚠️ การแก้ไขล่าสุดยังไม่ถูกบันทึกถาวร ระบบกำลังดาวน์โหลดไฟล์สำรองฉุกเฉินให้\nกรุณาเก็บไฟล์นี้ไว้ แล้วติดต่อผู้พัฒนา');
  try{ emergencyBackup(); }catch(_){}
}
function emergencyBackup(){
  const d=new Date();
  download(serialize(),`ฉุกเฉิน_ค่าน้ำประปา_${d.getFullYear()+543}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`,'application/json');
}
function storageUsedKB(){return Math.round(LAST_SIZE*2/1024);}

/* ===== สำรองอัตโนมัติในเครื่อง ===== */
let _snapT=null;
function snapshotLater(){clearTimeout(_snapT);_snapT=setTimeout(()=>{saveSnapshot();},5000);}
function saveSnapshot(tag){
  const now=new Date();
  const rec={id:(tag?'tag_'+tag+'_':'auto_')+iso(now)+'_'+pad(now.getHours())+pad(now.getMinutes()),
    at:now.toISOString(),users:DB.users.length,readings:DB.readings.length,data:serialize()};
  return idbTx('snap','readwrite',(st,set)=>{
    st.put(rec);
    const kq=st.getAllKeys();
    kq.onsuccess=()=>{const ks=(kq.result||[]).map(String).sort();
      if(ks.length>SNAP_KEEP)ks.slice(0,ks.length-SNAP_KEEP).forEach(k=>{try{st.delete(k);}catch(_){}});};
    set(true);
  }).then(v=>!!v);
}
function listSnapshots(){
  return idbTx('snap','readonly',(st,set)=>{const q=st.getAll();q.onsuccess=()=>set(q.result||[]);})
    .then(a=>(a||[]).sort((x,y)=>String(y.id).localeCompare(String(x.id))));
}

/* ===== เปิดโปรแกรม : เลือกที่เก็บข้อมูลและย้ายข้อมูลเดิมให้อัตโนมัติ ===== */
function startup(){
  return openDB().then(db=>{
    STORE=db?'idb':'local';
    return (db?idbLoadMain():Promise.resolve(null)).then(rec=>{
      const local=loadLocal();
      let obj=local;
      if(rec&&rec.data){
        let fromIdb=null;try{fromIdb=JSON.parse(rec.data);}catch(e){}
        const a=(fromIdb&&fromIdb.savedAt)||'',b=(local&&local.savedAt)||'';
        obj=(b&&b>a)?local:(fromIdb||local);        // เลือกชุดที่บันทึกล่าสุด
      }
      DB=normalize(obj);serialize();reindex();
      renderHeader();showTab('dash');
      // ย้ายข้อมูลเดิมจาก localStorage เข้าฐานข้อมูลในเครื่อง (ครั้งแรกที่อัปเดตเป็น v1.1)
      if(STORE==='idb'&&(!rec||!rec.data)&&(DB.users.length||DB.readings.length))idbSaveMain(serialize());
      if(STORE==='local'&&storageUsedKB()>3000)setTimeout(()=>{
        alert('⚠️ เบราว์เซอร์นี้ไม่รองรับฐานข้อมูลขนาดใหญ่ และพื้นที่เก็บข้อมูลใกล้เต็มแล้ว\nกรุณาสำรองข้อมูลทันที และเปิดระบบด้วย Chrome หรือ Edge รุ่นใหม่');
      },1500);
    });
  });
}

  const t=n=>{if(n===0)return'';if(n>=1e6)return t(Math.floor(n/1e6))+'ล้าน'+t(n%1e6);
    const s=String(n),L=s.length;let r='';
    for(let i=0;i<L;i++){const d=+s[i],p=L-i-1;if(!d)continue;

/* ===== คำนวณค่าน้ำ ===== */
function calcBill(units){
  const s=S();let w=0;units=+units||0;
  if(s.rateMode==='flat') w=units*(+s.flatRate||0);
  else{
    const tiers=[...s.tiers].sort((a,b)=>(a.upTo??1e12)-(b.upTo??1e12));
    if(s.tierMethod==='whole'){
      const t=tiers.find(t=>t.upTo==null||units<=t.upTo)||tiers[tiers.length-1];
      w=units*(+t?.rate||0);
    }else{
      let prev=0;
      for(const t of tiers){const cap=t.upTo==null?Infinity:+t.upTo;
        if(units>prev)w+=(Math.min(units,cap)-prev)*(+t.rate||0);
        prev=cap;if(units<=cap)break;}
    }
  }
  w=r2(w);
  const free=(units===0&&!s.chargeFeeOnZero);          // ไม่ใช้น้ำเลย = ไม่เก็บอะไรเลย
  const minAdj=free?0:((+s.minCharge>0&&w<+s.minCharge)?r2(+s.minCharge-w):0);
  const meterFee=free?0:r2(+s.meterFee||0);
  const base=r2(w+minAdj+meterFee);
  const vat=s.vatEnabled?r2(base*(+s.vatRate||0)/100):0;
  return {water:w,minAdj,meterFee,vat,total:r2(base+vat)};
}
function dueDateOf(period){
  const[y,m]=period.split('-').map(Number);
  const first=new Date(y,m,1);
  const last=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  return iso(new Date(first.getFullYear(),first.getMonth(),Math.min(+S().dueDay||15,last)));
}
function fineFor(r,payDate){
  const s=S();if(!+s.fineValue||s.fineMode==='none')return 0;
  if(payDate<=r.dueDate)return 0;
  return s.fineMode==='percent'?r2(r.total*s.fineValue/100):r2(s.fineValue);
}
function prevReadingRec(userId,period){
  const rs=readingsOf(userId);let best=null;              // rs เรียงตามเดือนแล้ว
  for(const r of rs){if(r.period<period)best=r;else break;}
  return best;
}
function prevReading(userId,period){
  const b=prevReadingRec(userId,period);
  return b?+b.curr:(+(userById(userId)?.startReading)||0);
}
const unpaidOf=userId=>IDX.unpaid.get(userId)||[];
/* ค่าเฉลี่ยการใช้น้ำย้อนหลัง (ใช้เตือนเลขมาตรผิดปกติ) */
function avgUnits(userId,period){
  const rs=readingsOf(userId).filter(r=>r.period<period).slice(-6);
  if(!rs.length)return 0;
  return rs.reduce((a,r)=>a+(+r.units||0),0)/rs.length;
}
/* ตรวจความต่อเนื่องของเลขมาตร : เลขครั้งก่อนต้องตรงกับเลขครั้งนี้ของเดือนก่อนหน้า */
function chainIssues(period){
  const out=[];
  for(const r of readingsIn(period)){
    const p=prevReadingRec(r.userId,r.period);
    const expect=p?+p.curr:(+(userById(r.userId)?.startReading)||0);
    if(+r.prev!==expect)out.push({r,expect,u:userById(r.userId)});
  }
  return out;
}

/* แยกพิกัดจากข้อความที่วางมา รองรับทั้ง "14.7,104.1" และลิงก์ Google Maps */
function parseCoord(t){
  t=String(t||'');
  let m=t.match(/@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/)        // ลิงก์ .../@14.7,104.1,17z
     ||t.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{2,3}\.\d{3,})/);  // 14.712345, 104.123456
  if(!m)return null;
  const lat=+m[1],lng=+m[2];
  if(!isFinite(lat)||!isFinite(lng))return null;
  if(Math.abs(lat)>90||Math.abs(lng)>180)return null;
  return {lat:+lat.toFixed(6),lng:+lng.toFixed(6)};
}

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'&&text[i+1]==='"'){cur+='"';i++;}else if(c==='"')q=false;else cur+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur='';}
    else cur+=c;}
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()));
}
/* ตรวจว่าไฟล์ที่เลือกเป็นไฟล์ข้อความ CSV จริงหรือไม่
   กันกรณีผู้ใช้เลือก .xlsx/.xls/.pdf/.json แล้วเบราว์เซอร์อ่านไบนารีมาเป็นตัวอักษรมั่ว ๆ */
function notCSVMsg(buf,name){
  const b=new Uint8Array(buf||new ArrayBuffer(0));
  const howExcel='\n\nวิธีแก้: เปิดไฟล์ด้วย Excel → File → Save As → เลือกชนิดไฟล์ "Excel Workbook (*.xlsx)" → แล้วค่อยนำเข้าไฟล์ .xlsx ที่ได้';
  if(b[0]===0xD0&&b[1]===0xCF)return 'ไฟล์นี้เป็นไฟล์ Excel รุ่นเก่า (.xls) ซึ่งยังอ่านไม่ได้'+howExcel;
  if(b[0]===0x25&&b[1]===0x50&&b[2]===0x44&&b[3]===0x46)return 'ไฟล์นี้เป็นไฟล์ PDF ไม่ใช่ไฟล์ CSV';
  if(/\.json$/i.test(name||''))return 'ไฟล์นี้เป็นไฟล์สำรองข้อมูล (.json)\n\nถ้าต้องการกู้คืนข้อมูลทั้งหมด ให้ไปที่ ⚙️ ตั้งค่า → กู้คืนจากไฟล์ แทน';
  for(let i=0;i<b.length;i++)if(b[i]===0)return 'ไฟล์นี้ไม่ใช่ไฟล์ข้อความ จึงนำเข้าไม่ได้';
  return '';
}
function importCSV(){
  pickFile('.xlsx,.csv',f=>{
    const hd=new FileReader();
    hd.onerror=()=>alert('อ่านไฟล์ไม่สำเร็จ');
    hd.onload=()=>{
      const b=new Uint8Array(hd.result);
      const rd=new FileReader();
      rd.onerror=()=>alert('อ่านไฟล์ไม่สำเร็จ');
      if(b[0]===0x50&&b[1]===0x4B){                      // .xlsx (ไฟล์ zip)
        rd.onload=()=>{
          let rows;
          try{ rows=xlsxFirstSheet(new Uint8Array(rd.result)); }
          catch(e){ return alert('อ่านไฟล์ Excel ไม่สำเร็จ: '+(e&&e.message||e)+'\n\nข้อมูลเดิมไม่ถูกแก้ไข'); }
          importRows(rows,f);
        };
        rd.readAsArrayBuffer(f);
        return;
      }
      const msg=notCSVMsg(hd.result,f.name);
      if(msg)return alert(msg+'\n\nข้อมูลเดิมไม่ถูกแก้ไข');
      rd.onload=()=>importCSVText(String(rd.result),f);
      rd.readAsText(f,'utf-8');
    };
    hd.readAsArrayBuffer(f.slice?f.slice(0,512):f);
  });
}
function importCSVText(raw,f){importRows(parseCSV(String(raw).replace(/^﻿/,'')),f);}
function importRows(rows,f){
   try{
    if(rows.length&&/มาตร|ชื่อ/.test(rows[0].join('')))rows.shift();
    if(!rows.length)return alert('ไม่พบข้อมูลในไฟล์');
    // ตรวจสอบก่อน แล้วค่อยบันทึกทีเดียว (กันข้อมูลเข้าไปครึ่ง ๆ กลาง ๆ)
    const have=new Set(DB.users.map(u=>u.meterNo));
    const add=[],bad=[];
    rows.forEach((r,i)=>{
      const meterNo=(r[0]||'').trim(),name=(r[1]||'').trim();
      if(!meterNo||!name){bad.push(`บรรทัด ${i+2}: ไม่มีเลขมาตรหรือชื่อ`);return;}
      if(meterNo.length>40||name.length>150){bad.push(`บรรทัด ${i+2}: ข้อมูลยาวผิดปกติ (ไฟล์อาจไม่ใช่แบบฟอร์มนำเข้า)`);return;}
      if(have.has(meterNo)){bad.push(`บรรทัด ${i+2}: เลขมาตร ${meterNo} ซ้ำ`);return;}
      have.add(meterNo);
      let lat=null,lng=null;
      const ls=(r[6]||'').trim(),gs=(r[7]||'').trim();
      if(ls!==''&&gs!==''){
        const a=+ls,b=+gs;
        if(isFinite(a)&&isFinite(b)&&Math.abs(a)<=90&&Math.abs(b)<=180){lat=+a.toFixed(6);lng=+b.toFixed(6);}
        else bad.push(`บรรทัด ${i+2}: พิกัดไม่ถูกต้อง (นำเข้าชื่อให้ แต่ไม่ใส่พิกัด)`);
      }
      add.push({id:uid(),meterNo,name,houseNo:(r[2]||'').trim(),moo:(r[3]||'').trim(),phone:(r[4]||'').trim(),
        startReading:+String(r[5]||'').trim()||0,status:'active',note:'',lat,lng});
    });
    if(rows.length>=3&&bad.length>rows.length*0.6)
      return alert(`ไฟล์นี้ไม่ใช่แบบฟอร์มนำเข้าผู้ใช้น้ำ (เสียรูปแบบ ${bad.length} จาก ${rows.length} บรรทัด)\n\nให้กดปุ่ม "ดาวน์โหลดแบบฟอร์ม Excel" ไปกรอกก่อน แล้วค่อยนำเข้า\n\nข้อมูลเดิมไม่ถูกแก้ไข`);
    if(!add.length)return alert('ไม่มีรายการที่นำเข้าได้\n'+bad.slice(0,15).join('\n'));
    if(!confirm(`ตรวจสอบไฟล์แล้ว\n· นำเข้าได้ ${add.length} ราย\n· ข้าม ${bad.length} รายการ\n\nยืนยันนำเข้าหรือไม่?`))return;
    saveSnapshot('ก่อนนำเข้า').then(()=>{
      const ms=new Set(moos());add.forEach(u=>{if(u.moo)ms.add(u.moo);});
      DB.users.push(...add);
      S().moos=[...ms].sort((a,b)=>a.localeCompare(b,'th',{numeric:true})).join(',');
      logAct('นำเข้าผู้ใช้น้ำ',`${add.length} ราย จากไฟล์ ${f.name}`);
      save();
      alert(`นำเข้าสำเร็จ ${add.length} ราย${bad.length?`\n\nข้าม ${bad.length} รายการ:\n`+bad.slice(0,15).join('\n')+(bad.length>15?`\n… และอีก ${bad.length-15} รายการ`:''):''}`);
      renderUsers();
    });
   }catch(e){alert('นำเข้าไม่สำเร็จ: '+(e&&e.message||e)+'\nข้อมูลเดิมไม่ถูกแก้ไข');}
}
/* ===== ส่งออกข้อมูลสำหรับงานแผนที่ภาษี / QGIS ===== */
function usersWithCoord(){return DB.users.filter(u=>u.lat!=null&&u.lng!=null&&isFinite(u.lat)&&isFinite(u.lng));}
function userStats(u){
  const rs=readingsOf(u.id);
  const n=rs.length;
  const avg=n?Math.round(rs.reduce((a,r)=>a+(+r.units||0),0)/n):0;
  const up=unpaidOf(u.id);
  const last=n?rs[n-1]:null;
  return {months:n,avgUnits:avg,unpaidMonths:up.length,unpaidAmount:r2(up.reduce((a,r)=>a+r.total,0)),
    lastPeriod:last?last.period:'',lastUnits:last?+last.units:null};
}
function exportGeoJSON(){
  const list=usersWithCoord();
  if(!list.length)return alert('ยังไม่มีผู้ใช้น้ำรายใดที่บันทึกพิกัดไว้\n\nใส่พิกัดได้ที่ 👥 ผู้ใช้น้ำ → แก้ไข → ช่องพิกัด\nหรือนำเข้าพร้อมกันทาง CSV');
  const fc={type:'FeatureCollection',
    name:'มาตรน้ำ '+(S().orgName||''),
    crs:{type:'name',properties:{name:'urn:ogc:def:crs:OGC:1.3:CRS84'}},
    features:list.map(u=>{const st=userStats(u);return{
      type:'Feature',
      geometry:{type:'Point',coordinates:[+u.lng,+u.lat]},
      properties:{meter_no:u.meterNo,name:u.name,house_no:u.houseNo,moo:String(u.moo||''),
        phone:u.phone||'',status:u.status==='inactive'?'งดใช้':'ใช้งาน',
        months:st.months,avg_units:st.avgUnits,last_period:st.lastPeriod,last_units:st.lastUnits,
        unpaid_months:st.unpaidMonths,unpaid_amount:st.unpaidAmount,note:u.note||''}};})};
  download(JSON.stringify(fc,null,1),`มาตรน้ำ_${(S().orgName||'อบต').replace(/[\\/:*?"<>|]/g,'')}_${today()}.geojson`,'application/geo+json');
  toast(`ส่งออก ${list.length} จุดแล้ว`);
}

function calcRow(tr){
  const p=tr.querySelector('.in-prev').value,c=tr.querySelector('.in-curr').value;
  const set=(k,v)=>tr.querySelector(k).textContent=v;
  tr.classList.remove('err');tr.classList.remove('warnrow');tr._odd=false;
  if(c===''){['.c-u','.c-w','.c-m','.c-t'].forEach(k=>set(k,''));tr._b=null;return;}
  const u=(+c)-(+p);
  if(u<0){tr.classList.add('err');set('.c-u','ผิด');['.c-w','.c-m','.c-t'].forEach(k=>set(k,''));tr._b=null;return;}
  const av=+tr.dataset.av||0;
  const odd=av>0?(u>Math.max(av*4,av+80)):(u>400);     // สูงผิดปกติเทียบค่าเฉลี่ย 6 เดือนล่าสุด
  if(odd){tr.classList.add('warnrow');tr._odd=true;}
  const b=calcBill(u);tr._b={units:u,...b};
  set('.c-u',fmt0(u)+(odd?' ⚠️':''));set('.c-w',fmt(b.water+b.minAdj));set('.c-m',fmt(b.meterFee));set('.c-t',fmt(b.total));
}

  if($('#sU')){$('#sU').textContent=fmt0(u);$('#sW').textContent=fmt(w);$('#sM').textContent=fmt(m);$('#sT').textContent=fmt(t);}

function saveReadings(){
  const trs=[...document.querySelectorAll('#rdBody tr[data-uid]')];
  const cur=new Map(readingsIn(rdP).map(r=>[r.userId,r]));
  const del=[],put=[];let err=0,odd=0;
  for(const tr of trs){
    const userId=tr.dataset.uid,ex=cur.get(userId);
    if(ex&&ex.paid)continue;                                   // บิลที่ชำระแล้ว ห้ามแก้
    const c=tr.querySelector('.in-curr').value;
    if(c===''){if(ex)del.push(ex);continue;}
    if(!tr._b){err++;continue;}
    if(tr._odd)odd++;
    put.push({tr,ex,userId,c});
  }
  if(del.length&&!confirm(`⚠️ มี ${del.length} รายการที่ช่อง "ครั้งนี้" ถูกลบออก\nการบันทึกครั้งนี้จะ "ลบบิลของเดือน ${pLabel(rdP)}" ของรายการเหล่านั้นทิ้ง\n\nยืนยันหรือไม่?`))return;
  if(odd&&!confirm(`⚠️ มี ${odd} ราย ที่ปริมาณน้ำสูงผิดปกติเมื่อเทียบกับค่าเฉลี่ยย้อนหลัง (แถวสีเหลือง)\nกรุณาตรวจว่าพิมพ์เลขมาตรถูกต้องแล้ว\n\nยืนยันบันทึกหรือไม่?`))return;
  if(del.length){const ds=new Set(del);DB.readings=DB.readings.filter(r=>!ds.has(r));logAct('ลบบิล',`${rdP} จำนวน ${del.length} รายการ`);}
  let n=0;
  for(const it of put){
    const d={prev:+it.tr.querySelector('.in-prev').value,curr:+it.c,...it.tr._b,dueDate:dueDateOf(rdP),readDate:today()};
    if(it.ex)Object.assign(it.ex,d);else DB.readings.push({id:uid(),userId:it.userId,period:rdP,paid:false,payId:null,...d});
    n++;
  }
  save();renderRead();
  alert(`บันทึก ${n} ราย${del.length?` · ลบ ${del.length} ราย`:''}${err?`\n⚠️ มี ${err} รายที่เลขครั้งนี้น้อยกว่าครั้งก่อน ยังไม่ได้บันทึก`:''}`);
}

function nextReceiptNo(date){
  const by=String(+date.slice(0,4)+543);const s=S();s.receiptSeq=s.receiptSeq||{};
  const used=new Set(DB.payments.filter(p=>p.receiptNo&&String(p.receiptNo).startsWith(by+'/')).map(p=>p.receiptNo));
  let n=+s.receiptSeq[by]||0,no;
  do{n++;no=`${by}/${String(n).padStart(5,'0')}`;}while(used.has(no));   // กันเลขใบเสร็จซ้ำ (เช่น ย้อนวันที่/กู้คืนข้อมูล)
  s.receiptSeq[by]=n;return no;
}

  if(!ids.length)return alert('กรุณาเลือกเดือนที่จะชำระ');
  const rs=ids.map(id=>DB.readings.find(r=>r.id===id)).filter(Boolean).sort((a,b)=>a.period.localeCompare(b.period));
  if(rs.length!==ids.length)return alert('ข้อมูลบิลเปลี่ยนแปลงระหว่างทำรายการ กรุณาเลือกใหม่อีกครั้ง');
  if(rs.some(r=>r.paid))return alert('มีบิลที่ถูกชำระไปแล้วในรายการ กรุณากดค้นหาผู้ใช้น้ำใหม่อีกครั้ง');
  const autoF=rs.map(r=>fineFor(r,payDate));const autoSum=autoF.reduce((a,b)=>a+b,0);
  const fineTotal=r2(+$('#pFine').value||0);
  if(fineTotal<0)return alert('ค่าปรับต้องไม่ติดลบ');
  // กระจายค่าปรับตามสัดส่วน (กรณีแก้ไขยอดค่าปรับ)
  const items=rs.map((r,i)=>({readingId:r.id,period:r.period,units:r.units,water:r2(r.water+r.minAdj),meterFee:r.meterFee,total:r.total,fine:autoSum?r2(autoF[i]/autoSum*fineTotal):(i===rs.length-1?fineTotal:0)}));
  const amount=r2(rs.reduce((a,r)=>a+r.total,0));
  if(!confirm(`ยืนยันรับชำระ ${fmt(amount+fineTotal)} บาท ?`))return;
  _paying=true;
  try{
    const p={id:uid(),receiptNo:nextReceiptNo(payDate),date:payDate,userId:payUser,items,amount,fine:fineTotal,total:r2(amount+fineTotal),cancelled:false,created:new Date().toISOString()};
    DB.payments.push(p);rs.forEach(r=>{r.paid=true;r.payId=p.id;});
    if(fineTotal!==r2(autoSum))logAct('แก้ไขค่าปรับ',`ใบเสร็จ ${p.receiptNo} จาก ${r2(autoSum)} เป็น ${fineTotal}`);
    save();renderPay();toast('รับชำระเรียบร้อย');printReceipt(p.id);
  }finally{_paying=false;}
}
function cancelPay(id){
  const p=payById(id);if(!p||p.cancelled)return;
  const why=prompt(`ยกเลิกใบเสร็จเลขที่ ${p.receiptNo}\nระบุเหตุผล:`);if(why===null)return;
  if(!String(why).trim())return alert('กรุณาระบุเหตุผลการยกเลิก');
  p.cancelled=true;p.cancelReason=String(why).trim();p.cancelDate=today();
  p.items.forEach(i=>{const r=DB.readings.find(x=>x.id===i.readingId);if(r){r.paid=false;r.payId=null;}});
  logAct('ยกเลิกใบเสร็จ',`${p.receiptNo} · ${fmt(p.total)} บาท · เหตุผล: ${p.cancelReason}`);
  save();renderPay();toast('ยกเลิกใบเสร็จแล้ว');
}

    <div style="display:flex;justify-content:space-between;margin-top:4px"><span>เลขที่ <b>${esc(p.receiptNo)}</b></span><span>วันที่ ${thDateFull(p.date)}</span></div>

let arMoo='',arOver=true;
function arrearsData(){
  const t=today();const out=[];
  for(const [uid,all] of IDX.unpaid){                      // ไล่เฉพาะบิลค้างชำระ ไม่กวาดทั้งตาราง
    const u=userById(uid);if(!u||(arMoo&&String(u.moo)!==arMoo))continue;
    const rs=arOver?all.filter(r=>r.dueDate<t):all.slice();
    if(!rs.length)continue;
    out.push({u,rs,amt:rs.reduce((a,r)=>a+r.total,0),fine:rs.reduce((a,r)=>a+fineFor(r,t),0)});
  }
  return out.sort((a,b)=>cmpU(a.u,b.u));
}
function renderArrears(){
  const d=arrearsData();const ta=d.reduce((a,x)=>a+x.amt,0),tf=d.reduce((a,x)=>a+x.fine,0);
  $('#tab-arrears').innerHTML=`<div class="card"><h2>⚠️ ผู้ค้างชำระค่าน้ำ</h2>
  <div class="row" style="margin-bottom:10px">
    <div class="fld"><label>หมู่</label><select id="arMoo">${mooOpts(arMoo)}</select></div>
    <label style="padding-bottom:8px"><input type="checkbox" id="arOver" ${arOver?'checked':''}> เฉพาะที่เกินกำหนดชำระ</label>
    <button class="btn sec" onclick="printArrears()">🖨️ พิมพ์รายชื่อ</button>
  </div>
  <div class="muted">${d.length} ราย · ค่าน้ำ ${fmt(ta)} · ค่าปรับถึงวันนี้ ${fmt(tf)} · รวม ${fmt(ta+tf)} บาท</div>
  <div class="tbl-wrap"><table><thead><tr><th>เลขที่มาตร</th><th>ชื่อ-สกุล</th><th>บ้าน/หมู่</th><th>โทร</th><th>เดือนที่ค้าง</th><th class="n">ค่าน้ำ</th><th class="n">ค่าปรับ</th><th class="n">รวม</th><th></th></tr></thead><tbody>
  ${d.map(x=>`<tr><td>${esc(x.u.meterNo)}</td><td>${esc(x.u.name)}</td><td>${esc(x.u.houseNo)} / ${esc(x.u.moo)}</td><td>${esc(x.u.phone)}</td><td>${x.rs.map(r=>pShort(r.period)).join(', ')} <span class="tag bad">${x.rs.length}</span></td><td class="n">${fmt(x.amt)}</td><td class="n">${fmt(x.fine)}</td><td class="n"><b>${fmt(x.amt+x.fine)}</b></td><td><button class="btn sm ok" onclick="goPay('${x.u.id}')">รับชำระ</button></td></tr>`).join('')||'<tr><td colspan="9" class="c muted">ไม่มีผู้ค้างชำระ 🎉</td></tr>'}
  </tbody></table></div></div>`;
  $('#arMoo').onchange=e=>{arMoo=e.target.value;renderArrears();};

}
function printArrears(){
  const d=arrearsData();const ta=d.reduce((a,x)=>a+x.amt,0),tf=d.reduce((a,x)=>a+x.fine,0);

}

const AR3_TYPES=['ค่าน้ำประปา','ค่าขยะ','ค่าเช่า','อื่นๆ'];
let rpAR3Type='ค่าน้ำประปา';
/* real = ช่อง "ชำระแล้ว" ใส่เฉพาะบิลที่รับชำระแล้วจริง (ยอดค้างใน e-LAAS จึงตรงความจริง)
   same = ใส่ตัวเลขเดียวกันทั้งสองช่อง (ยอดค้างจะเป็น 0 ทุกราย) */
let rpAR3Mode='real';

function b64ToBytes(b){const s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
const bytesToText=a=>new TextDecoder('utf-8').decode(a);
const textToBytes=t=>new TextEncoder().encode(t);

/* CRC-32 และตัวเขียนไฟล์ ZIP แบบไม่บีบอัด (ไม่ต้องพึ่งไลบรารีภายนอก) */
const CRC_T=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(),u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  const parts=[],dir=[];let off=0;
  for(const f of files){
    const nb=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(sz),...u32(sz),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,f.data);dir.push({nb,crc,sz,off});off+=lh.length+nb.length+sz;
  }
  const cdOff=off;
  for(const d of dir){
    const ch=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(d.crc),...u32(d.sz),...u32(d.sz),...u16(d.nb.length),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(0),...u32(d.off)]);
    parts.push(ch,d.nb);off+=ch.length+d.nb.length;
  }
  parts.push(new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(dir.length),...u16(dir.length),
    ...u32(off-cdOff),...u32(cdOff),...u16(0)]));
  let total=0;for(const x of parts)total+=x.length;
  const out=new Uint8Array(total);let q=0;
  for(const x of parts){out.set(x,q);q+=x.length;}
  return out;
}

const xmlEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function colName(n){let s='';while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=(n-r-1)/26;}return s;}
/* ปีงบประมาณ พ.ศ. -> 12 เดือน เริ่มตุลาคม */
function arFiscalMonths(be){
  const yp=be-544,yc=be-543,o=[];
  for(const m of [10,11,12])o.push(yp+'-'+pad(m));
  for(let m=1;m<=9;m++)o.push(yc+'-'+pad(m));
  return o;
}
/* แถวข้อมูลรายคน
   ยอดเงิน(บาท)  = ยอดที่ต้องชำระของเดือนนั้น
   ชำระแล้ว(บาท) = ยอดที่รับชำระแล้วจริง (โหมด real) หรือเท่ากับยอดที่ต้องชำระ (โหมด same) */
function ar3Rows(be,typeName,mode){
  mode=mode||rpAR3Mode;
  const ms=arFiscalMonths(be),out=[];
  for(const u of [...DB.users].sort(cmpU)){
    const byP=new Map(readingsOf(u.id).map(r=>[r.period,r]));
    const cells=[];let sumDue=0,sumPaid=0,any=false;
    for(const pp of ms){
      const r=byP.get(pp),due=r?r2(r.total):0;
      const paid=(mode==='same')?due:((r&&r.paid)?r2(r.total):0);
      if(due>0)any=true;
      cells.push([due,paid]);sumDue+=due;sumPaid+=paid;
    }
    if(!any)continue;
    out.push({u,cells,remain:r2(sumDue-sumPaid),paid:r2(sumPaid),due:r2(sumDue)});
  }
  return out;
}
function buildAR3(be,typeName,mode){
  const rows=ar3Rows(be,typeName,mode);
  if(!rows.length)return null;
  const files=new Map();
  for(const [n,b] of AR3_TPL)files.set(n,b64ToBytes(b));

  /* --- คลังข้อความ (sharedStrings) --- */
  let ss=bytesToText(files.get('xl/sharedStrings.xml'));
  const mm=ss.match(/<sst[^>]*count="(\d+)"[^>]*uniqueCount="(\d+)"/);
  let cnt=+mm[1],uniq=+mm[2];
  const idx=new Map(),add=[];
  (ss.match(/<si>[\s\S]*?<\/si>/g)||[]).forEach((blk,i)=>{
    const t=(blk.match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[]).map(x=>x.replace(/<[^>]*>/g,'')).join('');
    if(!idx.has(t))idx.set(t,i);
  });
  const sid=t=>{
    if(idx.has(t))return idx.get(t);
    const i=uniq+add.length;idx.set(t,i);
    add.push('<si><t xml:space="preserve">'+xmlEsc(t)+'</t></si>');return i;
  };

  /* --- แถวข้อมูลในชีต TAX เริ่มที่แถว 4 --- */
  const xr=[];let rn=3;
  for(const row of rows){
    rn++;
    const c=[`<c r="A${rn}"><v>${be}</v></c>`,
      `<c r="B${rn}" t="s"><v>${sid(typeName)}</v></c>`,
      `<c r="C${rn}" t="s"><v>${sid(row.u.name)}</v></c>`];
    let n=4;
    for(const [due,paid] of row.cells){
      c.push(`<c r="${colName(n)}${rn}"><v>${due}</v></c>`);
      c.push(`<c r="${colName(n+1)}${rn}"><v>${paid}</v></c>`);
      n+=2;
    }
    c.push(`<c r="AB${rn}"><v>${row.remain}</v></c>`);
    c.push(`<c r="AC${rn}"><v>${row.paid}</v></c>`);
    xr.push(`<row r="${rn}" spans="1:30">${c.join('')}</row>`);
  }
  if(add.length){
    ss=ss.replace('count="'+cnt+'"','count="'+(cnt+add.length)+'"')
         .replace('uniqueCount="'+uniq+'"','uniqueCount="'+(uniq+add.length)+'"')
         .replace('</sst>',add.join('')+'</sst>');
    files.set('xl/sharedStrings.xml',textToBytes(ss));
  }
  let sh=bytesToText(files.get('xl/worksheets/sheet1.xml'));
  sh=sh.replace(/<dimension ref="[^"]*"\/>/,'<dimension ref="A1:AD'+rn+'"/>')
       .replace('</sheetData>',xr.join('')+'</sheetData>');
  files.set('xl/worksheets/sheet1.xml',textToBytes(sh));

  return {bytes:zipStore([...files].map(([name,data])=>({name,data}))),rows};
}
function exportAR3(){
  const be=+rpFY||(new Date().getFullYear()+544);
  let res=null;
  try{ res=buildAR3(be,rpAR3Type); }
  catch(e){ return alert('สร้างไฟล์ไม่สำเร็จ: '+(e&&e.message||e)); }
  if(!res)return alert(`ไม่มีข้อมูลค่าน้ำในปีงบประมาณ ${be}\n(ปีงบประมาณ ${be} = ตุลาคม ${be-1} ถึง กันยายน ${be})`);
  downloadBytes(res.bytes,`นำเข้า e-LAAS_${rpAR3Type}_ปีงบ${be}.xlsx`,
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  toast(`ส่งออก ${res.rows.length} ราย`);
}
function downloadBytes(bytes,name,type){
  const url=URL.createObjectURL(new Blob([bytes],{type}));
  const a=document.createElement('a');a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

/* ===== ตัวเขียนไฟล์ Excel (.xlsx) อย่างง่าย =====
   เหตุผลที่ต้องมี: ถ้าส่งออกเป็น CSV แล้วเปิดด้วย Excel
   เบอร์โทร 0862992312 จะกลายเป็น 862992312 (ศูนย์หน้าหาย)
   และบ้านเลขที่ 23/2 จะกลายเป็นวันที่ 23 ก.พ.
   ไฟล์ .xlsx กำหนดรูปแบบช่องเป็น "ข้อความ" ได้ จึงไม่เพี้ยน */
const XQ=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
function xlCol(i){let s='',n=i+1;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;}
/* head=หัวตาราง · rows=ข้อมูล · types=['text'|'num'|'auto'] · widths=ความกว้างคอลัมน์ */
function buildXLSX(sheetName,head,rows,types,widths){
  types=types||head.map(()=>'text');
  const isNum=(v,t)=>t==='num'||(t==='auto'&&String(v).trim()!==''&&/^-?\d+(\.\d+)?$/.test(String(v).trim()));
  const cellXML=(ci,ri,v,t)=>{
    if(v==null||v==='')return '';
    const ref=xlCol(ci)+ri;
    if(isNum(v,t)&&isFinite(+v))return `<c r="${ref}"><v>${+v}</v></c>`;
    return `<c r="${ref}" t="inlineStr" s="2"><is><t xml:space="preserve">${XQ(v)}</t></is></c>`;
  };
  let body=`<row r="1">`+head.map((h,i)=>`<c r="${xlCol(i)}1" t="inlineStr" s="1"><is><t>${XQ(h)}</t></is></c>`).join('')+`</row>`;
  rows.forEach((r,ri)=>{body+=`<row r="${ri+2}">`+r.map((v,ci)=>cellXML(ci,ri+2,v,types[ci])).join('')+`</row>`;});
  const cols=`<cols>`+head.map((h,i)=>`<col min="${i+1}" max="${i+1}" width="${(widths&&widths[i])||16}" customWidth="1"${types[i]==='text'?' style="2"':''}/>`).join('')+`</cols>`;
  const last=xlCol(head.length-1)+(rows.length+1);
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:${last}"/><sheetViews><sheetView workbookViewId="0" tabSelected="1"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A2" sqref="A2"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>${cols}<sheetData>${body}</sheetData><autoFilter ref="A1:${xlCol(head.length-1)}${Math.max(rows.length+1,2)}"/></worksheet>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Tahoma"/></font><font><b/><sz val="11"/><name val="Tahoma"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDCE9F7"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const wb=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${XQ(String(sheetName).replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31))}" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const wbRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
  return zipStore([
    {name:'[Content_Types].xml',data:textToBytes(ct)},
    {name:'_rels/.rels',data:textToBytes(rels)},
    {name:'xl/workbook.xml',data:textToBytes(wb)},
    {name:'xl/_rels/workbook.xml.rels',data:textToBytes(wbRels)},
    {name:'xl/styles.xml',data:textToBytes(styles)},
    {name:'xl/worksheets/sheet1.xml',data:textToBytes(sheet)},
  ]);
}

function pHead(title){const s=S();return`<div class="p-head">${s.logo?`<img src="${s.logo}"><br>`:''}<div class="o">${esc(s.orgName)}</div>${s.orgAddr?`<div>${esc(s.orgAddr)}</div>`:''}<div style="font-weight:700;margin-top:4px">${esc(title)}</div></div>`;}
/* ===== ข้อมูลประกอบแบบพิมพ์ ===== */
function villageMap(){
  const m={};
  String(S().villages||'').split(/[\n;]+/).forEach(line=>{
    const i=line.indexOf('=');if(i<1)return;
    m[line.slice(0,i).trim()]=line.slice(i+1).trim();
  });
  return m;
}
function addrOf(u){
  const s=S(),vm=villageMap();
  const parts=[];
  if(u.houseNo)parts.push(u.houseNo);
  if(u.moo)parts.push('ม. '+u.moo);
  const v=vm[String(u.moo)];if(v)parts.push(v);
  if(s.tambon)parts.push('ต.'+s.tambon);
  if(s.amphoe)parts.push('อ.'+s.amphoe);
  if(s.province)parts.push('จ.'+s.province);
  return parts.join(' ');
}
/* เลขที่ใบแจ้งหนี้ เช่น INV690016978 = INV + ปี พ.ศ. 2 หลัก + ลำดับ 7 หลัก */
function invNoFor(r){
  if(r.invNo)return r.invNo;
  const s=S();s.invSeq=s.invSeq||{};
  const be=String(+r.period.slice(0,4)+543).slice(-2);
  const used=new Set();for(const x of DB.readings)if(x.invNo)used.add(x.invNo);
  let n=+s.invSeq[be]||0,no;
  do{n++;no=`${s.invPrefix||'INV'}${be}${String(n).padStart(7,'0')}`;}while(used.has(no));
  s.invSeq[be]=n;r.invNo=no;return no;
}
function thDateSlash(d){                       // 31/10/2569
  if(!d)return '';const[y,m,dd]=String(d).split('-');
  return `${dd}/${m}/${+y+543}`;
}
function unitRateText(){
  const s=S();
  return s.rateMode==='flat'?fmt(s.flatRate):'(ตามอัตราขั้นบันได)';
}
function dotted(v,w){return `<span class="dt" style="min-width:${w||70}px">${v==null?'':v}</span>`;}

function slipHead(){const s=S();return`<div style="display:flex;gap:10px;align-items:center;justify-content:center">${s.logo?`<img src="${s.logo}" style="width:42px;height:42px;object-fit:contain">`:''}<div style="text-align:center"><b>${esc(s.systemName)} ${esc(s.orgName)}</b>${s.orgAddr?`<br><span style="font-size:12px">${esc(s.orgAddr)}</span>`:''}</div></div>`;}
function signs(){const s=S();return`<div class="sign"><div>ลงชื่อ.........................................ผู้จัดทำ<br>(${esc(s.collectorName)||'.........................................'})<br>${esc(s.collectorPos)}</div><div>ลงชื่อ.........................................ผู้ตรวจสอบ<br>(${esc(s.headName)||'.........................................'})<br>${esc(s.headPos)}</div></div>`;}
let _printSeq=0;
function printHTML(h){
  const pa=$('#printArea');pa.innerHTML=h;document.body.classList.add('printing');
  const seq=++_printSeq;
  let fired=false;
  const go=()=>{if(fired)return;fired=true;
    try{window.print();}catch(e){}
    setTimeout(()=>{if(seq===_printSeq)endPrint();},2000);};   // เผื่อเบราว์เซอร์ไม่ส่ง afterprint
  const imgs=[...pa.querySelectorAll('img')].filter(i=>!i.complete);
  if(imgs.length){let n=imgs.length;const d=()=>{if(--n<=0)go();};
    imgs.forEach(i=>{i.addEventListener('load',d,{once:true});i.addEventListener('error',d,{once:true});});
    setTimeout(go,1500);}                              // กันรูปโหลดค้าง
  else setTimeout(go,120);
}
function endPrint(){
  document.body.classList.remove('printing');
  const pa=$('#printArea');if(pa)pa.innerHTML='';      // คืนหน่วยความจำ (พิมพ์พันใบแล้วค้างใน DOM)
}
window.addEventListener('afterprint',endPrint);

function resizeImg(src,max,cb){const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/png'));};im.src=src;}
function download(content,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function pickFile(accept,cb){const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>i.files[0]&&cb(i.files[0]);i.click();}
function backup(){
  DB.settings.lastBackup=new Date().toISOString();save();
  const d=new Date();download(JSON.stringify(DB),`สำรองค่าน้ำประปา_${d.getFullYear()+543}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`,'application/json');
  toast('สำรองข้อมูลแล้ว');

function validateBackup(d){
  if(!d||typeof d!=='object'||Array.isArray(d))return 'โครงสร้างไฟล์ไม่ถูกต้อง';
  for(const k of ['users','readings','payments','expenses'])
    if(d[k]!==undefined&&!Array.isArray(d[k]))return `ส่วน "${k}" ไม่ถูกต้อง`;
  if(!Array.isArray(d.users)||!Array.isArray(d.readings))return 'ไม่พบข้อมูลผู้ใช้น้ำหรือข้อมูลการจดมาตร';
  if(d.settings!==undefined&&(typeof d.settings!=='object'||d.settings===null||Array.isArray(d.settings)))return 'ส่วนตั้งค่าไม่ถูกต้อง';
  if(d.settings&&d.settings.logo&&!/^data:image\//.test(String(d.settings.logo)))return 'ตราสัญลักษณ์ในไฟล์ไม่ใช่รูปภาพ (ไฟล์อาจถูกแก้ไข ไม่ปลอดภัย)';
  if(d.users.some(u=>!u||typeof u!=='object'||!u.id))return 'ข้อมูลผู้ใช้น้ำไม่ครบถ้วน';
  if(d.readings.some(r=>!r||typeof r!=='object'||!r.userId||!r.period))return 'ข้อมูลการจดมาตรไม่ครบถ้วน';
  return '';
}
function applyRestore(obj,what){
  DB=normalize(obj);logAct('กู้คืนข้อมูล',what);save();
  renderHeader();toast('กู้คืนเรียบร้อย');showTab('dash');
}
function restore(){
  pickFile('.json',f=>{const rd=new FileReader();rd.onload=()=>{
    let d;try{d=JSON.parse(rd.result);}catch(e){return alert('อ่านไฟล์ไม่สำเร็จ — ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบ');}
    const bad=validateBackup(d);if(bad)return alert('ไฟล์สำรองไม่ถูกต้อง: '+bad+'\n\nไม่ได้แก้ไขข้อมูลเดิมแต่อย่างใด');
    if(!confirm(`กู้คืนข้อมูล: ผู้ใช้น้ำ ${d.users.length} ราย · บิล ${d.readings.length} รายการ\nข้อมูลปัจจุบันจะถูกแทนที่ทั้งหมด ยืนยัน?`))return;
    if(DB.users.length||DB.readings.length){
      if(confirm('แนะนำ: ดาวน์โหลดไฟล์สำรองของข้อมูล "ปัจจุบัน" เก็บไว้ก่อน\nต้องการสำรองก่อนหรือไม่?'))backup();
    }
    saveSnapshot('ก่อนกู้คืน').then(()=>applyRestore(d,`จากไฟล์ ${f.name}`));
  };rd.readAsText(f);});
}
function resetAll(){
  if(!confirm('ล้างข้อมูลทั้งหมด (ผู้ใช้น้ำ บิล ใบเสร็จ รายจ่าย) ?'))return;
  if(prompt('พิมพ์คำว่า ลบ เพื่อยืนยัน')!=='ลบ')return;
  if(DB.users.length||DB.readings.length){
    if(!confirm('ระบบจะดาวน์โหลดไฟล์สำรองให้ก่อนล้างข้อมูล\nกด ตกลง เพื่อดำเนินการต่อ'))return;
    backup();
  }
  saveSnapshot('ก่อนล้างข้อมูล').then(()=>{
    const st=DB.settings,au=DB.audit||[];
    DB={users:[],readings:[],payments:[],expenses:[],settings:st,audit:au};
    st.receiptSeq={};st.expSeq={};
    logAct('ล้างข้อมูลทั้งหมด','');save();toast('ล้างข้อมูลแล้ว');showTab('dash');
  });
}

function restoreSnap(id){
  listSnapshots().then(ls=>{
    const x=ls.find(y=>String(y.id)===id);if(!x)return alert('ไม่พบข้อมูลสำรองชุดนี้');
    let d;try{d=JSON.parse(x.data);}catch(e){return alert('ข้อมูลสำรองชุดนี้เสียหาย');}
    const bad=validateBackup(d);if(bad)return alert('ข้อมูลสำรองไม่ถูกต้อง: '+bad);
    if(!confirm(`กู้คืนข้อมูล ณ ${thDate(String(x.at).slice(0,10))} ${String(x.at).slice(11,16)} น.\nผู้ใช้น้ำ ${d.users.length} ราย · บิล ${d.readings.length} รายการ\nข้อมูลปัจจุบันจะถูกแทนที่ทั้งหมด ยืนยัน?`))return;
    saveSnapshot('ก่อนกู้คืน').then(()=>{closeModal();applyRestore(d,'จากสำรองอัตโนมัติ '+x.at);});
  });
}

      <tr><td><b>แถวสีแดง "ผิด"</b></td><td>เลขครั้งนี้น้อยกว่าครั้งก่อน</td><td>แก้ให้ถูก ไม่งั้นระบบจะไม่บันทึกแถวนั้น</td></tr>
      <tr><td><b>แถบเตือนความต่อเนื่อง</b></td><td>เลขครั้งก่อนไม่ตรงกับเลขครั้งนี้ของเดือนที่แล้ว มักเกิดจากแก้บิลย้อนหลังหรือเปลี่ยนมาตร</td><td>กด "ดูรายละเอียด" ตรวจก่อนออกบิล</td></tr>
      <tr><td><b>คอลัมน์เฉลี่ยย้อนหลัง</b></td><td>ค่าเฉลี่ยการใช้น้ำ 6 เดือนล่าสุด</td><td>ใช้เทียบกับเลขที่เพิ่งจดได้ทันที</td></tr></table>
    <h4>กรณีพิเศษ</h4>
    <ul>
      <li><b>เปลี่ยนมาตรใหม่</b> — แก้ช่อง "ครั้งก่อน" ให้เป็นเลขเริ่มต้นของมาตรใหม่ได้เลย</li>
      <li><b>บ้านปิด / ไม่ได้จด</b> — เว้นช่องครั้งนี้ว่างไว้ ระบบจะไม่ออกบิลให้เดือนนั้น</li>
      <li><b>ลบบิลที่ออกไปแล้ว</b> — ลบเลขในช่องครั้งนี้ออกแล้วกดบันทึก ระบบจะถามยืนยันก่อนลบ</li>
      <li><b>บิลที่ชำระเงินแล้ว แก้ไม่ได้</b> — ต้องยกเลิกใบเสร็จก่อน (เมนู 💵 รับชำระ)</li>
    </ul>`)}

  ${sec('print','🖨️','พิมพ์เอกสาร',`
    <p>ที่หน้า 📝 จดมาตร มีช่อง <b>แบบพิมพ์</b> ให้เลือกก่อนกดพิมพ์</p>
    <table><tr><th>แบบ</th><th>ได้อะไร</th><th>ใช้เมื่อไหร่</th></tr>
      <tr><td><b>ใบเสร็จ + ใบแจ้งหนี้</b><br>2 ราย/แผ่น</td><td>ตัด 4 ชิ้น ซ้ายใบเสร็จ ขวาใบแจ้งหนี้</td><td>หน่วยงานที่ใช้ใบเสร็จแบบนี้เป็นเอกสารจริง</td></tr>
      <tr><td><b>แบบย่อ</b><br>2 ราย/แผ่น</td><td>ใบแจ้งค่าน้ำย่อ มีช่องลงนาม</td><td>แบบดั้งเดิมของระบบ</td></tr>
      <tr><td><b>ใบแจ้งค่าน้ำ</b><br>6 ราย/แผ่น</td><td>ตัด 6 ชิ้น มีที่อยู่ ยอดต้องชำระ กำหนดชำระ</td><td><b>เดินแจกตามบ้าน — ประหยัดกระดาษที่สุด</b></td></tr></table>
    <p>ที่ผู้ใช้น้ำ 1,000 ราย แบบ 6 ใบ/แผ่น ใช้กระดาษเดือนละ 167 แผ่น ส่วนแบบ 2 ราย/แผ่น ใช้ 500 แผ่น</p>
    <h4>เอกสารอื่น</h4>
    <ul>
      <li><b>แบบฟอร์มจดมาตร (เปล่า)</b> — พิมพ์ไปเขียนมือตอนเดินจด มีเลขครั้งก่อนให้แล้ว</li>
      <li><b>ทะเบียนผู้ใช้น้ำ</b> — เมนู 👥 ผู้ใช้น้ำ</li>
      <li><b>รายชื่อค้างชำระ</b> — เมนู ⚠️ ค้างชำระ</li>
      <li><b>ใบสำคัญจ่าย</b> — เมนู 🧾 รายจ่าย กดที่รายการ</li>
    </ul>
    <div class="hp-warn">ก่อนพิมพ์จำนวนมาก <b>ลองพิมพ์ 1 แผ่นก่อน</b> เสมอ แล้วตรวจว่าขอบกระดาษไม่โดนตัด ตั้งค่าเครื่องพิมพ์เป็น A4 ขอบกระดาษ 10 มม.</div>`)}

  ${sec('pay','💵','รับชำระและใบเสร็จ',`
    <h4>รับเงิน</h4>
    <ol>
      <li>พิมพ์เลขมาตร ชื่อ หรือบ้านเลขที่ในช่องค้นหา แล้วกดเลือกรายชื่อ</li>
      <li>ระบบแสดงบิลค้างทุกเดือน ติ๊กเลือกเดือนที่จะชำระ (ค่าเริ่มต้นเลือกทั้งหมด)</li>
      <li>ค่าปรับคำนวณให้อัตโนมัติ — <b>แก้ไขหรือยกเว้นได้</b> โดยพิมพ์ทับในช่องค่าปรับ</li>
      <li>กด <b>✅ รับชำระและพิมพ์ใบเสร็จ</b> ระบบจะพิมพ์ต้นฉบับและสำเนาให้</li>
    </ol>
    <h4>เลขที่ใบเสร็จ</h4>
    <p>เดินอัตโนมัติตามปี พ.ศ. ของวันที่รับชำระ เช่น <span class="hp-k">2569/00001</span> ระบบกันเลขซ้ำให้แล้ว แม้จะย้อนวันที่หรือกู้คืนข้อมูล</p>
    <h4>ยกเลิกใบเสร็จ</h4>
    <p>กดปุ่ม <b>ยกเลิก</b> ที่รายการใบเสร็จ <b>ต้องระบุเหตุผลทุกครั้ง</b> เมื่อยกเลิกแล้วบิลจะกลับมาเป็นค้างชำระ และเหตุการณ์ถูกบันทึกไว้ในประวัติการแก้ไขข้อมูล</p>
    <div class="hp-warn">เลขที่ใบเสร็จที่ยกเลิกแล้วจะ<b>ไม่ถูกนำกลับมาใช้ซ้ำ</b> เพื่อให้ตรวจสอบย้อนหลังได้ ซึ่งถูกต้องตามหลักการบัญชี</div>`)}

  ${sec('debt','⚠️','ติดตามหนี้ค้างชำระ',`
    <p>เมนู ⚠️ ค้างชำระ แสดงทุกรายที่ยังไม่ชำระ พร้อมจำนวนเดือนที่ค้างและค่าปรับคิดถึงวันนี้</p>
    <ul>
      <li>กรองเฉพาะ<b>รายที่เกินกำหนดชำระ</b>แล้วได้</li>
      <li>กรองตามหมู่ เพื่อแยกให้ผู้ใหญ่บ้านแต่ละหมู่ติดตาม</li>
      <li>พิมพ์รายชื่อไปติดบอร์ดหรือแนบหนังสือทวงถาม</li>
      <li>กดชื่อเพื่อดูประวัติการใช้น้ำและการชำระย้อนหลังทั้งหมด</li>
    </ul>`)}

  ${sec('exp','🧾','รายจ่ายและงบการเงิน',`
    <p>บันทึกรายจ่ายของกิจการประปา เช่น ค่าไฟฟ้าสูบน้ำ สารส้ม คลอรีน ค่าซ่อม ค่าจ้างผู้ดูแล</p>
    <ul>
      <li>ปุ่ม <b>หมวดรายจ่าย / ยอดเงินยกมา</b> ใช้เพิ่มหมวดเอง และใส่เงินคงเหลือตั้งต้น</li>
      <li>ทุกรายการพิมพ์ <b>ใบสำคัญจ่าย</b> ได้</li>
      <li>เมนู 📑 รายงาน มีงบรายรับ-รายจ่ายรายเดือนและรายปีงบประมาณ (ต.ค.–ก.ย.)</li>
    </ul>`)}

  ${sec('rate','⚙️','ตั้งอัตราค่าน้ำและค่าปรับ',`
    <h4>อัตราค่าน้ำ</h4>
    <table><tr><th style="width:150px">แบบ</th><th>วิธีคิด</th></tr>
      <tr><td><b>ราคาเดียว</b></td><td>ทุกหน่วยราคาเท่ากัน เช่น หน่วยละ 8 บาท ใช้ 15 หน่วย = 120 บาท</td></tr>
      <tr><td><b>ขั้นบันได แบบสะสม</b></td><td>คิดไล่ทีละช่วง เช่น 1-10 หน่วยละ 6 · 11-20 หน่วยละ 8 → ใช้ 15 หน่วย = (10×6)+(5×8) = 100 บาท</td></tr>
      <tr><td><b>ขั้นบันได แบบทั้งก้อน</b></td><td>ดูว่าตกช่วงไหนแล้วคิดราคานั้นทั้งหมด → ใช้ 15 หน่วย = 15×8 = 120 บาท</td></tr></table>
    <h4>ค่าอื่น ๆ</h4>
    <ul>
      <li><b>ค่าน้ำขั้นต่ำ</b> — ถ้าค่าน้ำที่คำนวณได้น้อยกว่านี้ ระบบจะเติมให้ครบ และแสดงเป็นบรรทัด "เพิ่มค่าใช้น้ำไปจากอัตราอย่างต่ำ" บนใบเสร็จ</li>
      <li><b>ค่ารักษามาตร / ค่าบริการทั่วไป</b> — เก็บทุกเดือนเท่ากันทุกราย</li>
      <li><b>ไม่ใช้น้ำเลย (0 หน่วย)</b> — เลือกได้ว่าจะยังเก็บค่าบริการทั่วไปหรือไม่</li>
      <li><b>ค่าปรับ</b> — คิดเป็นจำนวนเงินคงที่ หรือเป็น % ของยอดบิล ต่อ 1 บิลที่เกินกำหนด</li>
      <li><b>วันครบกำหนดชำระ</b> — วันที่เท่าไรของเดือนถัดไป</li>
    </ul>
    <p>ช่อง <b>ทดลองคำนวณ</b> ในหน้าตั้งค่า ใส่จำนวนหน่วยแล้วดูผลได้ทันทีก่อนบันทึก</p>
    <div class="hp-bad"><b>ภาษีมูลค่าเพิ่มและคำว่า "ใบกำกับภาษี"</b> — ค่าเริ่มต้นปิดไว้ ถ้าหน่วยงานไม่ได้จดทะเบียนภาษีมูลค่าเพิ่ม การออกเอกสารที่มีคำว่าใบกำกับภาษีหรือเรียกเก็บ VAT อาจมีความผิดตามประมวลรัษฎากร ตรวจสอบกับกองคลังก่อนเปิดใช้</div>`)}

  ${sec('imp','👥','นำเข้าผู้ใช้น้ำจาก Excel',`
    <ol>
      <li>เมนู 👥 ผู้ใช้น้ำ → กด <b>ดาวน์โหลดแบบฟอร์ม Excel</b></li>
      <li>เปิดด้วย Excel กรอกข้อมูลตามหัวคอลัมน์: เลขที่มาตร · ชื่อ-สกุล · บ้านเลขที่ · หมู่ที่ · เบอร์โทร · เลขมาตรเริ่มต้น</li>
      <li>กด Save ตามปกติ <b>ไม่ต้องแปลงเป็น CSV</b></li>
      <li>กด <b>📥 นำเข้าจาก Excel</b> แล้วเลือกไฟล์ .xlsx นั้น</li>
    </ol>
    <p>แบบฟอร์มตั้งช่อง เลขที่มาตร · บ้านเลขที่ · เบอร์โทร ไว้เป็นชนิด <b>ข้อความ</b> แล้ว บ้านเลขที่ <b>23/2</b> จึงไม่กลายเป็นวันที่ และเบอร์ <b>081…</b> จะไม่ถูกตัดเลขศูนย์หน้าทิ้ง</p>
    <p>ถ้ามีไฟล์ <b>.csv</b> เดิมอยู่แล้วก็นำเข้าได้เหมือนกัน ระบบดูให้เองว่าเป็นไฟล์ชนิดไหน</p>
    <p>ระบบจะ<b>ตรวจทั้งไฟล์ก่อน</b> แล้วบอกว่านำเข้าได้กี่ราย ข้ามกี่รายและเพราะอะไร (เช่น เลขมาตรซ้ำ ไม่มีชื่อ) จากนั้นจึงถามยืนยัน — ไม่มีกรณีข้อมูลเข้าไปครึ่ง ๆ กลาง ๆ</p>
    <p>ระบบสำรองข้อมูลอัตโนมัติให้ก่อนนำเข้าทุกครั้ง ถ้านำเข้าผิดสามารถย้อนกลับได้ที่ ⚙️ ตั้งค่า → 🕘 สำรองอัตโนมัติในเครื่อง</p>`)}

  ${sec('backup','💾','สำรองและกู้คืนข้อมูล',`
    <div class="hp-bad"><b>อ่านหัวข้อนี้ให้จบ — สำคัญที่สุดในคู่มือ</b><br>
    ข้อมูลทั้งหมดเก็บอยู่ใน<u>เบราว์เซอร์ของเครื่องนี้เท่านั้น</u> ไม่ได้อยู่บนอินเทอร์เน็ต และไม่ได้อยู่ในไฟล์โปรแกรม<br>
    ถ้าเครื่องเสีย ลงวินโดวส์ใหม่ เปลี่ยนเบราว์เซอร์ หรือล้างข้อมูลเว็บไซต์ <b>ข้อมูลจะหายทั้งหมดและกู้คืนไม่ได้</b></div>
    <h4>สิ่งที่ต้องทำ</h4>
    <ul>
      <li>กด <b>⬇️ สำรองข้อมูล</b> ที่ ⚙️ ตั้งค่า <b>อย่างน้อยสัปดาห์ละครั้ง</b> และทุกครั้งหลังปิดงานประจำเดือน</li>
      <li>เก็บไฟล์ .json ที่ได้ไว้ใน <b>USB หรือ Google Drive</b> อย่าเก็บไว้แค่ในเครื่องเดียว</li>
      <li>ตั้งชื่อไฟล์ให้รู้วันที่ ระบบตั้งให้อัตโนมัติอยู่แล้ว</li>
    </ul>
    <p>ระบบจะเตือนเองบนหน้าแดชบอร์ดถ้าไม่ได้สำรองเกิน 7 วัน</p>
    <h4>สิ่งที่ห้ามทำ</h4>
    <ul>
      <li>อย่าล้างประวัติการท่องเว็บแบบ "ข้อมูลเว็บไซต์ / คุกกี้" ทั้งหมด</li>
      <li>อย่าเปิดระบบด้วยเบราว์เซอร์คนละตัวสลับไปมา (เปิดด้วย Chrome ก็ใช้ Chrome ตลอด)</li>
    </ul>
    <h4>เผลอกดผิด ลบผิด นำเข้าผิด</h4>
    <p>⚙️ ตั้งค่า → <b>🕘 สำรองอัตโนมัติในเครื่อง</b> ระบบเก็บย้อนหลังให้ 14 ชุดโดยอัตโนมัติ และสำรองให้ก่อนทุกครั้งที่กู้คืน ล้างข้อมูล หรือนำเข้า — เลือกชุดก่อนหน้าแล้วกดกู้คืนได้ทันที</p>
    <p class="muted">ข้อควรรู้: ชุดสำรองอัตโนมัติอยู่ในเครื่องเดียวกัน ถ้าเครื่องเสียก็หายไปด้วย จึงไม่สามารถใช้แทนการสำรองเป็นไฟล์ได้</p>
    <h4>ตรวจสอบย้อนหลัง</h4>
    <p>⚙️ ตั้งค่า → <b>🧾 ประวัติการแก้ไขข้อมูล</b> ดูได้ว่ามีการยกเลิกใบเสร็จ ลบบิล แก้ค่าปรับ แก้อัตราค่าน้ำ หรือกู้คืนข้อมูลเมื่อใด และบันทึกเป็นไฟล์ CSV เก็บไว้ได้</p>`)}

  ${sec('move','🖥️','ย้ายเครื่อง / ติดตั้งเครื่องใหม่',`
    <h4>ติดตั้งเครื่องใหม่</h4>
    <p>ก๊อปไฟล์โปรแกรมไฟล์เดียวไปวางที่เครื่องใหม่แล้วดับเบิลคลิกเปิดได้เลย ไม่ต้องติดตั้ง ไม่ต้องต่ออินเทอร์เน็ต</p>
    <h4>ย้ายข้อมูลตามไปด้วย</h4>
    <ol>
      <li>เครื่องเก่า → ⚙️ ตั้งค่า → <b>สำรองข้อมูล</b> ได้ไฟล์ .json</li>
      <li>เครื่องใหม่ → เปิดโปรแกรม → ⚙️ ตั้งค่า → <b>กู้คืนจากไฟล์</b> → เลือกไฟล์นั้น</li>
      <li>ตรวจว่าจำนวนผู้ใช้น้ำและยอดเงินตรงกับเครื่องเก่า</li>

    <p>ไฟล์สำรองมีทุกอย่าง ทั้งข้อมูล การตั้งค่า อัตราค่าน้ำ และตราสัญลักษณ์</p>

function openHelp(id){
  const d=$('#hp-'+id);if(!d)return;
  document.querySelectorAll('details.hp').forEach(x=>{if(x!==d)x.open=false;});
  d.open=true;if(d.scrollIntoView)d.scrollIntoView({behavior:'smooth',block:'start'});
}

startup();

/* ===== ติดตั้งลงมือถือ / แท็บเล็ต (PWA) ===== */
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
const isStandalone=()=>window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let deferredInstall=null;

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const w=reg.installing;if(!w)return;
        w.addEventListener('statechange',()=>{
          if(w.state==='installed'&&navigator.serviceWorker.controller)
            toast('มีเวอร์ชันใหม่แล้ว ปิดแล้วเปิดใหม่เพื่อใช้งาน');
        });
      });
    }).catch(()=>{});
  });
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;showInstallBar();});

function installDismissed(){try{return localStorage.getItem('prapa_inst_x')==='1';}catch(e){return false;}}
function dismissInstall(){try{localStorage.setItem('prapa_inst_x','1');}catch(e){}
  const b=$('#instBar');if(b)b.remove();}
function showInstallBar(){
  if(isStandalone()||installDismissed()||$('#instBar'))return;
  if(location.protocol.indexOf('http')!==0)return;          // เปิดจากไฟล์ ติดตั้งไม่ได้
  const d=document.createElement('div');d.className='inst';d.id='instBar';
  d.innerHTML=`<div style="flex:1"><b>ติดตั้งลงหน้าจอเครื่องนี้</b>
    ${isIOS()?'กดปุ่มแชร์ด้านล่าง แล้วเลือก "เพิ่มไปยังหน้าจอโฮม"':'ใช้งานออฟไลน์ได้ และข้อมูลไม่ถูกลบทิ้ง'}</div>
    ${isIOS()?'':'<button class="go" onclick="doInstall()">ติดตั้ง</button>'}
    <button class="no" onclick="dismissInstall()">ไว้ก่อน</button>`;
  document.body.appendChild(d);
}
function doInstall(){
  if(!deferredInstall)return dismissInstall();
  deferredInstall.prompt();
  deferredInstall.userChoice.finally(()=>{deferredInstall=null;dismissInstall();});
}
/* บนมือถือที่เปิดผ่านเว็บแต่ยังไม่ได้ติดตั้ง ให้ชวนติดตั้ง (iOS ไม่มีปุ่มอัตโนมัติ) */
setTimeout(()=>{
  const mobile=/android|iphone|ipad|ipod/i.test(navigator.userAgent);
  if(mobile&&!isStandalone())showInstallBar();
},2500);
</script>
